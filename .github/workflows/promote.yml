name: Promote

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      source-environment:
        type: string
        required: true
      target-environment:
        type: string
        required: true
      git-sha:
        type: string
        required: true
      aws-region:
        type: string
        required: true

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target-environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - run: |
          aws s3 cp \
            s3://${{ vars.S3_BUCKET }}/${{ inputs.app-name }}/${{ inputs.source-environment }}/${{ inputs.git-sha }}/image.tar.gz \
            s3://${{ vars.S3_BUCKET }}/${{ inputs.app-name }}/${{ inputs.target-environment }}/${{ inputs.git-sha }}/image.tar.gz

  notify:
    needs: promote
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.promote.result == 'success'
        run: |
          echo "promoted ${{ inputs.app-name }} from ${{ inputs.source-environment }} to ${{ inputs.target-environment }} at ${{ inputs.git-sha }}"

      - if: needs.promote.result != 'success'
        run: |
          echo "promote FAILED for ${{ inputs.app-name }} from ${{ inputs.source-environment }} to ${{ inputs.target-environment }} at ${{ inputs.git-sha }}, result: ${{ needs.promote.result }}"
