name: Rollback

# Reusable workflow: consuming repos call this to roll an environment back to
# either an explicit target-sha or, if omitted, the manifest's recorded
# "previousManifestKey" (i.e. one deploy back).
on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      environment:
        type: string
        required: true
      target-sha:
        type: string
        required: false # omit to roll back to the previous successful deploy
      aws-region:
        type: string
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # required for OIDC federation to the AWS deploy role
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      # Resolve which manifest to roll back to: an explicit target-sha wins;
      # otherwise read current.json and follow its previousManifestKey.
      # Fails loudly if there's nowhere to roll back to.
      - run: |
          CURRENT_KEY="${{ inputs.app-name }}/${{ inputs.environment }}/current.json"

          if [ -n "${{ inputs.target-sha }}" ]; then
            TARGET_KEY="${{ inputs.app-name }}/${{ inputs.environment }}/${{ inputs.target-sha }}/manifest.json"
          else
            aws s3 cp "s3://${{ vars.S3_BUCKET }}/$CURRENT_KEY" current.json
            TARGET_KEY=$(jq -r '.previousManifestKey' current.json)
            if [ -z "$TARGET_KEY" ]; then
              echo "::error::current.json has no previousManifestKey and no target-sha was given - nothing to roll back to."
              exit 1
            fi
          fi

          if ! aws s3api head-object --bucket ${{ vars.S3_BUCKET }} --key "$TARGET_KEY" >/dev/null 2>&1; then
            echo "::error::Target manifest $TARGET_KEY does not exist."
            exit 1
          fi

          # Promote the target manifest to "current" - this is the actual
          # rollback: deploy.yml's render-manifest step reads/writes this
          # same current.json pointer on the next forward deploy.
          aws s3 cp "s3://${{ vars.S3_BUCKET }}/$TARGET_KEY" target-manifest.json
          aws s3 cp target-manifest.json "s3://${{ vars.S3_BUCKET }}/$CURRENT_KEY"

          TARGET_SHA=$(jq -r '.gitSha' target-manifest.json)
          echo "rolled back ${{ inputs.app-name }} in ${{ inputs.environment }} to $TARGET_SHA ($TARGET_KEY)"

  notify:
    needs: rollback
    if: always() # log the outcome even if the rollback step failed
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      # Emit a single structured event to CloudWatch Logs recording the
      # outcome of this rollback, for audit/alerting.
      - run: |
          RESULT="${{ needs.rollback.result }}"

          MESSAGE=$(jq -n \
            --arg eventType "rollback" \
            --arg appName "${{ inputs.app-name }}" \
            --arg environment "${{ inputs.environment }}" \
            --arg targetSha "${{ inputs.target-sha }}" \
            --arg result "$RESULT" \
            --arg workflowRunId "${{ github.run_id }}" \
            --arg triggeredBy "${{ github.actor }}" \
            '{eventType:$eventType, appName:$appName, environment:$environment, targetSha:$targetSha, result:$result, workflowRunId:$workflowRunId, triggeredBy:$triggeredBy}')

          LOG_GROUP="/aws-cicd/${{ inputs.environment }}"
          LOG_STREAM="${{ inputs.app-name }}"
          aws logs create-log-stream --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" 2>/dev/null || true

          TIMESTAMP=$(($(date +%s%N)/1000000))
          jq -n --argjson ts "$TIMESTAMP" --arg msg "$MESSAGE" '[{timestamp:$ts, message:$msg}]' > log-events.json

          aws logs put-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM" \
            --log-events file://log-events.json

          echo "$MESSAGE"
