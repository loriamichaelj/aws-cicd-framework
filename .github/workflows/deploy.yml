name: Deploy

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      language:
        type: string
        required: true
      environment:
        type: string
        required: true
      aws-region:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: inputs.language == 'python'
        run: |
          pip install -r requirements.txt
          python -m compileall -q src

      - if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - if: inputs.language == 'node'
        run: |
          npm ci
          npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: inputs.language == 'python'
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest -q

      - if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - if: inputs.language == 'node'
        run: |
          npm ci
          npm test

      - uses: actions/checkout@v4
        with:
          repository: loriamichaelj/aws-cicd-framework
          ref: dev
          path: .framework

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .framework/.hadolint.yaml

  deploy:
    name: Deploy
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - id: build
        run: |
          docker build -t ${{ inputs.app-name }}:${{ github.sha }} .
          docker run --rm ${{ inputs.app-name }}:${{ github.sha }}
          docker save ${{ inputs.app-name }}:${{ github.sha }} | gzip > image.tar.gz
          echo "digest=sha256:$(sha256sum image.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          aws s3 cp image.tar.gz s3://${{ vars.S3_BUCKET }}/${{ inputs.app-name }}/${{ inputs.environment }}/${{ github.sha }}/image.tar.gz

  render-manifest:
    name: Render Manifest
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - run: |
          cat > task-def.json <<EOF
          {
            "family": "${{ inputs.app-name }}-${{ inputs.environment }}",
            "containerDefinitions": [
              {
                "name": "${{ inputs.app-name }}",
                "image": "${{ inputs.app-name }}/${{ inputs.environment }}/${{ github.sha }}/image.tar.gz",
                "essential": true,
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/aws-cicd/${{ inputs.environment }}/${{ inputs.app-name }}",
                    "awslogs-region": "${{ inputs.aws-region }}",
                    "awslogs-stream-prefix": "${{ inputs.app-name }}"
                  }
                }
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "networkMode": "awsvpc",
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "PLACEHOLDER-set-before-ecs-registration"
          }
          EOF
          aws s3 cp task-def.json s3://${{ vars.S3_BUCKET }}/${{ inputs.app-name }}/${{ inputs.environment }}/${{ github.sha }}/task-def.json

      - run: |
          CURRENT_KEY="${{ inputs.app-name }}/${{ inputs.environment }}/current.json"
          PREVIOUS_MANIFEST_KEY=""

          if aws s3api head-object --bucket ${{ vars.S3_BUCKET }} --key "$CURRENT_KEY" >/dev/null 2>&1; then
            aws s3 cp "s3://${{ vars.S3_BUCKET }}/$CURRENT_KEY" previous.json
            PREV_SHA=$(jq -r '.gitSha' previous.json)
            PREVIOUS_MANIFEST_KEY="${{ inputs.app-name }}/${{ inputs.environment }}/${PREV_SHA}/manifest.json"
          fi

          cat > manifest.json <<EOF
          {
            "appName": "${{ inputs.app-name }}",
            "environment": "${{ inputs.environment }}",
            "gitSha": "${{ github.sha }}",
            "image": {
              "uri": "${{ inputs.app-name }}/${{ inputs.environment }}/${{ github.sha }}/image.tar.gz",
              "digest": "${{ needs.deploy.outputs.image-digest }}",
              "builtByRunId": "${{ github.run_id }}"
            },
            "taskDefinition": {
              "s3Key": "${{ inputs.app-name }}/${{ inputs.environment }}/${{ github.sha }}/task-def.json",
              "registered": false
            },
            "buildTimestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "triggeredBy": "${{ github.actor }}",
            "workflowRunId": "${{ github.run_id }}",
            "eventType": "deploy",
            "previousManifestKey": "$PREVIOUS_MANIFEST_KEY"
          }
          EOF

          aws s3 cp manifest.json "s3://${{ vars.S3_BUCKET }}/${{ inputs.app-name }}/${{ inputs.environment }}/${{ github.sha }}/manifest.json"
          aws s3 cp manifest.json "s3://${{ vars.S3_BUCKET }}/$CURRENT_KEY"

  notify:
    needs: [deploy, render-manifest]
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - run: |
          RESULT="success"
          if [ "${{ needs.deploy.result }}" != "success" ] || [ "${{ needs.render-manifest.result }}" != "success" ]; then
            RESULT="failure"
          fi

          MESSAGE=$(jq -n \
            --arg eventType "deploy" \
            --arg appName "${{ inputs.app-name }}" \
            --arg environment "${{ inputs.environment }}" \
            --arg gitSha "${{ github.sha }}" \
            --arg result "$RESULT" \
            --arg workflowRunId "${{ github.run_id }}" \
            --arg triggeredBy "${{ github.actor }}" \
            '{eventType:$eventType, appName:$appName, environment:$environment, gitSha:$gitSha, result:$result, workflowRunId:$workflowRunId, triggeredBy:$triggeredBy}')

          LOG_GROUP="/aws-cicd/${{ inputs.environment }}"
          LOG_STREAM="${{ inputs.app-name }}"
          aws logs create-log-stream --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" 2>/dev/null || true

          TIMESTAMP=$(($(date +%s%N)/1000000))
          jq -n --argjson ts "$TIMESTAMP" --arg msg "$MESSAGE" '[{timestamp:$ts, message:$msg}]' > log-events.json

          aws logs put-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM" \
            --log-events file://log-events.json

          echo "$MESSAGE"
